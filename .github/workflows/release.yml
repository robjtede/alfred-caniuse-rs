name: Release

on:
  push:
    branches: [main]

permissions: {}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'robjtede' }}
    outputs:
      releases: ${{ steps.release-plz.outputs.releases }}
      releases_created: ${{ steps.release-plz.outputs.releases_created }}
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2.0.1

      - name: Prepare and publish releases
        uses: release-plz/action@v0.5.148
        id: release-plz
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Install Nix
        if: ${{ steps.release-plz.outputs.releases_created == 'true' }}
        uses: nixbuild/nix-quick-install-action@v35

      - name: Enter Nix devshell
        if: ${{ steps.release-plz.outputs.releases_created == 'true' }}
        uses: nicknovitski/nix-develop@v1.2.1
        with:
          arguments: .#ci-release

      - name: Comment on release PR
        if: ${{ steps.release-plz.outputs.releases_created == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASES_JSON: ${{ steps.release-plz.outputs.releases }}
        run: x52-comment-release-pr "$RELEASES_JSON" "$GITHUB_SHA"

  upload-assets:
    name: Upload release assets
    needs: release
    if: ${{ needs.release.outputs.releases_created == 'true' }}
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      attestations: write
      contents: write
      id-token: write

    env:
      CARGO_INCREMENTAL: 0
      CARGO_NET_GIT_FETCH_WITH_CLI: true
      CARGO_NET_RETRY: 10
      CARGO_TERM_COLOR: always
      RELEASE_TAG: ${{ fromJSON(needs.release.outputs.releases)[0].tag }}
      RUST_BACKTRACE: 1
      RUSTUP_MAX_RETRIES: 10

    steps:
      - name: Check out release tag
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2.0.1
        with:
          cache: false
          target: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install just
        uses: taiki-e/install-action@v2.90.3
        with:
          tool: just

      - name: Build release assets
        run: just build-release

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: target/release-assets/*

      - name: Upload assets to draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" target/release-assets/* --clobber

  publish-release:
    name: Publish release
    needs:
      - release
      - upload-assets
    if: ${{ needs.release.outputs.releases_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    env:
      GH_TOKEN: ${{ github.token }}
      RELEASES_JSON: ${{ needs.release.outputs.releases }}
      RELEASE_TAG: ${{ fromJSON(needs.release.outputs.releases)[0].tag }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v35

      - name: Enter Nix devshell
        uses: nicknovitski/nix-develop@v1.2.1
        with:
          arguments: .#ci-release

      - name: Publish draft release
        run: gh release edit "$RELEASE_TAG" --draft=false --latest

      - name: Comment on release PR
        run: x52-comment-release-assets-uploaded "$RELEASES_JSON" "$GITHUB_SHA"
